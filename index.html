:root{

  --surface2:#11181f;
  --line:#1e2f3d;
  --cyan:#66ccff;
  --cyan-dim:#2a7aa8;
  --green:#00ff66;
  --yellow:#ffd400;
  --red:#ff3355;
  --text:#c8e6c9;
  --muted:#7a9bb5;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#000000;
    --surface:#0a0f14;
    --surface2:#11181f;
    --line:#1e2f3d;
    --cyan:#66ccff;
    --cyan-dim:#2a7aa8;
    --green:#00ff66;
    --yellow:#ffd400;
    --red:#ff3355;
    --text:#c8e6c9;
    --muted:#7a9bb5;
  }
}
*{
  box-sizing:border-box
}
html,body{
  background:#000;
  color:var(--text)
}
body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  margin:0
}
@keyframes pulseGlow{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:.45
  }
}
@keyframes scanMove{
  0%{
    transform:translateY(-100%)
  }
  100%{
    transform:translateY(1200%)
  }
}
@keyframes barGrow{
  from{
    width:0
  }
  to{
    width:100%
  }
}
@keyframes blink{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:0
  }
}
@keyframes rot360{
  from{
    transform:rotate(0deg)
  }
  to{
    transform:rotate(360deg)
  }
}
.scanline{
  position:relative;
  overflow:hidden
}
.scanline::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:56px;
  background:linear-gradient(180deg,transparent,rgba(102,204,255,.08),transparent);
  animation:scanMove 7s linear infinite;
  pointer-events:none
}
.cellBtn{
  transition:all .15s ease
}
.cellBtn:hover{
  transform:scale(1.06);
  z-index:2;
  position:relative
}
@media (min-width: 640px) {
  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

    font-size: 11px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[1fr_280px\] {

  }
}
